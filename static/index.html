<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PakTech Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #22263a;
      --border:   #2e3247;
      --accent:   #4f7ef8;
      --accent-h: #3a69e0;
      --text:     #e2e4ef;
      --muted:    #7a7f9a;
      --green:    #22c55e;
      --amber:    #f59e0b;
      --red:      #ef4444;
      --me-bg:    #1e3a6e;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); height: 100vh;
           display: flex; flex-direction: column; overflow: hidden; }

    /* ── Login screen ── */
    #login-screen {
      flex: 1; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px 36px; width: 340px;
    }
    .login-card h1 { font-size: 22px; margin-bottom: 6px; }
    .login-card p  { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; color: var(--muted);
                   margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px;
      padding: 9px 12px; outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .btn-primary {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 500;
      padding: 10px; cursor: pointer; margin-top: 8px;
    }
    .btn-primary:hover { background: var(--accent-h); }

    /* ── App shell ── */
    #app { flex: 1; display: none; overflow: hidden; }
    #app.visible { display: flex; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px; flex-shrink: 0; background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .sb-header { padding: 16px 14px 12px; border-bottom: 1px solid var(--border); }
    .sb-header h2 { font-size: 14px; font-weight: 600; }
    .sb-header p  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .sb-section { padding: 12px 14px 4px; font-size: 10px; font-weight: 600;
                  color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .room-item {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 10px; margin: 1px 4px; border-radius: 6px;
      cursor: pointer; font-size: 13px; color: var(--muted);
    }
    .room-item:hover { background: var(--surface2); color: var(--text); }
    .room-item.active { background: var(--accent); color: #fff; }
    .room-hash { font-size: 14px; opacity: .7; }
    .unread-badge {
      margin-left: auto; background: var(--red); color: #fff;
      font-size: 10px; padding: 1px 5px; border-radius: 10px; font-weight: 600;
    }
    .divider { height: 1px; background: var(--border); margin: 8px 14px; }
    .user-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 10px; margin: 1px 4px; border-radius: 6px;
      font-size: 12px; color: var(--muted);
    }
    .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600; flex-shrink: 0; position: relative;
    }
    .avatar-lg { width: 34px; height: 34px; font-size: 12px; }
    .presence {
      position: absolute; bottom: 0; right: 0;
      width: 8px; height: 8px; border-radius: 50%;
      border: 2px solid var(--surface);
    }
    .p-online { background: var(--green); }
    .sb-me {
      margin-top: auto; padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .me-info { flex: 1; min-width: 0; }
    .me-name { font-size: 12px; font-weight: 500; }
    .me-status { font-size: 10px; color: var(--muted); }

    /* ── Main chat ── */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header {
      padding: 12px 18px; border-bottom: 1px solid var(--border);
      background: var(--surface); display: flex; align-items: center; gap: 10px;
    }
    .chat-header h3 { font-size: 14px; font-weight: 600; }
    .chat-header span { font-size: 12px; color: var(--muted); }
    .ws-badge {
      margin-left: auto; font-size: 11px; padding: 3px 10px;
      border-radius: 20px; font-weight: 500;
    }
    .ws-connected    { background: #14532d; color: var(--green); }
    .ws-disconnected { background: #450a0a; color: var(--red); }

    /* ── Message feed ── */
    .msg-feed {
      flex: 1; overflow-y: auto; padding: 14px 18px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .msg-feed::-webkit-scrollbar { width: 4px; }
    .msg-feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .day-sep {
      display: flex; align-items: center; gap: 10px;
      color: var(--muted); font-size: 11px; margin: 10px 0 8px;
    }
    .day-sep::before, .day-sep::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .msg-group { display: flex; gap: 10px; margin-top: 8px; align-items: flex-start; }
    .msg-group.me { flex-direction: row-reverse; }
    .msg-body { flex: 1; min-width: 0; }
    .msg-group.me .msg-body { display: flex; flex-direction: column; align-items: flex-end; }
    .msg-meta { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; }
    .msg-group.me .msg-meta { flex-direction: row-reverse; }
    .msg-sender { font-size: 12px; font-weight: 600; color: var(--text); }
    .msg-time   { font-size: 11px; color: var(--muted); }
    .bubble {
      font-size: 13px; line-height: 1.55; color: var(--text);
      max-width: 420px; word-break: break-word;
    }
    .bubble.them {
      background: var(--surface2); padding: 7px 11px;
      border-radius: 2px 10px 10px 10px; display: inline-block;
    }
    .bubble.me {
      background: var(--me-bg); padding: 7px 11px;
      border-radius: 10px 2px 10px 10px; display: inline-block;
    }
    .cont-msg { padding-left: 44px; margin-top: 2px; }
    .cont-msg.me { padding-left: 0; padding-right: 44px;
                   display: flex; justify-content: flex-end; }
    .sys-msg { text-align: center; font-size: 11px; color: var(--muted); margin: 6px 0; }

    /* ── Typing indicator ── */
    .typing-bar {
      padding: 6px 18px; font-size: 12px; color: var(--muted);
      min-height: 28px; display: flex; align-items: center; gap: 8px;
      border-top: 1px solid var(--border);
    }
    .dots { display: flex; gap: 3px; }
    .dots span {
      width: 5px; height: 5px; border-radius: 50%; background: var(--muted);
      animation: bounce .9s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-4px); }
    }

    /* ── Input bar ── */
    .input-bar { padding: 10px 18px 14px; border-top: 1px solid var(--border);
                 background: var(--surface); }
    .input-wrap {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px;
    }
    .input-wrap:focus-within { border-color: var(--accent); }
    #msg-input {
      flex: 1; border: none; background: transparent;
      color: var(--text); font-size: 13px; outline: none;
    }
    #msg-input::placeholder { color: var(--muted); }
    .send-btn {
      width: 32px; height: 32px; border-radius: 7px;
      background: var(--accent); color: #fff; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .send-btn:hover { background: var(--accent-h); }
  </style>
</head>
<body>

<!-- ═══ LOGIN SCREEN ═══ -->
<div id="login-screen">
  <div class="login-card">
    <h1>PakTech Chat</h1>
    <p>Real-time WebSocket chat</p>
    <div class="field">
      <label>Username</label>
      <input id="login-username" type="text" placeholder="your_username" autocomplete="off" />
    </div>
    <div class="field">
      <label>Join room</label>
      <select id="login-room">
        <option value="1">1 — general</option>
        <option value="2">2 — engineering</option>
        <option value="3">3 — random</option>
      </select>
    </div>
    <button class="btn-primary" onclick="joinChat()">Join</button>
  </div>
</div>

<!-- ═══ APP SHELL ═══ -->
<div id="app">
  <div class="sidebar">
    <div class="sb-header">
      <h2>PakTech Chat</h2>
      <p id="online-count">0 online</p>
    </div>

    <div class="sb-section">Rooms</div>
    <div id="room-list"></div>

    <div class="divider"></div>
    <div class="sb-section">Online</div>
    <div id="user-list"></div>

    <div class="sb-me">
      <div class="avatar avatar-lg" id="me-avatar" style="background:#1e3a6e;color:#4f7ef8">
        --
        <span class="presence p-online"></span>
      </div>
      <div class="me-info">
        <div class="me-name" id="me-name">--</div>
        <div class="me-status">Active now</div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="chat-header">
      <h3 id="room-title"># general</h3>
      <span id="room-meta"></span>
      <span class="ws-badge ws-disconnected" id="ws-badge">Connecting…</span>
    </div>

    <div class="msg-feed" id="msg-feed">
      <div class="day-sep">Today</div>
    </div>

    <div class="typing-bar" id="typing-bar"></div>

    <div class="input-bar">
      <div class="input-wrap">
        <input id="msg-input" placeholder="Message #general" autocomplete="off" />
        <button class="send-btn" onclick="sendMessage()" title="Send">&#x27A4;</button>
      </div>
    </div>
  </div>
</div>

<script>
  const ROOMS = { 1: 'general', 2: 'engineering', 3: 'random' };
  const AVATAR_COLORS = [
    ['#1e3a6e','#4f7ef8'], ['#14532d','#22c55e'], ['#451a03','#f59e0b'],
    ['#3b0764','#a855f7'], ['#450a0a','#ef4444'], ['#0c4a6e','#38bdf8'],
  ];

  let ws = null;
  let currentUser = '';
  let currentRoom = 1;
  let typingTimer = null;
  let isTyping = false;
  let typingUsers = new Set();
  let onlineUsers = new Set();
  let lastSender = '';
  let lastTime = 0;
  let GROUP_GAP = 5 * 60 * 1000;

  function avatarFor(name) {
    let h = 0;
    for (let c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffffffff;
    return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
  }

  function initials(name) {
    return name.slice(0, 2).toUpperCase();
  }

  function timeStr(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function joinChat() {
    const u = document.getElementById('login-username').value.trim();
    const r = parseInt(document.getElementById('login-room').value);
    if (!u) return alert('Enter a username');
    currentUser = u;
    currentRoom = r;

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');

    const [bg, fg] = avatarFor(u);
    const av = document.getElementById('me-avatar');
    av.style.background = bg; av.style.color = fg;
    av.childNodes[0].nodeValue = initials(u);
    document.getElementById('me-name').textContent = u;

    renderRooms();
    connectWS();
  }

  function renderRooms() {
    const list = document.getElementById('room-list');
    list.innerHTML = '';
    for (const [id, name] of Object.entries(ROOMS)) {
      const el = document.createElement('div');
      el.className = 'room-item' + (parseInt(id) === currentRoom ? ' active' : '');
      el.innerHTML = `<span class="room-hash">#</span>${name}`;
      el.onclick = () => switchRoom(parseInt(id));
      list.appendChild(el);
    }
    document.getElementById('room-title').textContent = `# ${ROOMS[currentRoom]}`;
    document.getElementById('msg-input').placeholder = `Message #${ROOMS[currentRoom]}`;
  }

  function switchRoom(roomId) {
    if (roomId === currentRoom) return;
    if (ws) ws.close();
    currentRoom = roomId;
    lastSender = ''; lastTime = 0;
    document.getElementById('msg-feed').innerHTML = '<div class="day-sep">Today</div>';
    typingUsers.clear();
    renderTyping();
    renderRooms();
    connectWS();
  }

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}/ws/${currentRoom}?username=${encodeURIComponent(currentUser)}`;
    ws = new WebSocket(url);

    ws.onopen = () => {
      setBadge(true);
      onlineUsers.add(currentUser);
      renderUsers();
    };

    ws.onclose = () => {
      setBadge(false);
      setTimeout(connectWS, 3000);
    };

    ws.onerror = () => ws.close();

    ws.onmessage = (e) => {
      const ev = JSON.parse(e.data);
      switch (ev.type) {
        case 'message':
          typingUsers.delete(ev.username);
          renderTyping();
          appendMessage(ev);
          break;
        case 'user_joined':
          onlineUsers.add(ev.username);
          renderUsers();
          appendSys(`${ev.username} joined`);
          break;
        case 'user_left':
          onlineUsers.delete(ev.username);
          typingUsers.delete(ev.username);
          renderUsers();
          renderTyping();
          appendSys(`${ev.username} left`);
          break;
        case 'typing':
          if (ev.username !== currentUser) {
            typingUsers.add(ev.username);
            renderTyping();
          }
          break;
        case 'typing_stop':
          typingUsers.delete(ev.username);
          renderTyping();
          break;
      }
    };
  }

  function setBadge(connected) {
    const b = document.getElementById('ws-badge');
    b.textContent = connected ? 'Connected' : 'Reconnecting…';
    b.className = 'ws-badge ' + (connected ? 'ws-connected' : 'ws-disconnected');
  }

  function renderUsers() {
    const list = document.getElementById('user-list');
    list.innerHTML = '';
    for (const u of onlineUsers) {
      const [bg, fg] = avatarFor(u);
      const el = document.createElement('div');
      el.className = 'user-item';
      el.innerHTML = `
        <div class="avatar" style="background:${bg};color:${fg}">
          ${initials(u)}<span class="presence p-online"></span>
        </div>
        <span>${u}</span>`;
      list.appendChild(el);
    }
    document.getElementById('online-count').textContent = `${onlineUsers.size} online`;
  }

  function appendSys(text) {
    const feed = document.getElementById('msg-feed');
    const el = document.createElement('div');
    el.className = 'sys-msg';
    el.textContent = text;
    feed.appendChild(el);
    feed.scrollTop = feed.scrollHeight;
    lastSender = ''; lastTime = 0;
  }

  function appendMessage(ev) {
    const feed = document.getElementById('msg-feed');
    const isMe = ev.username === currentUser;
    const ts = new Date(ev.timestamp).getTime();
    const grouped = ev.username === lastSender && (ts - lastTime) < GROUP_GAP;
    lastSender = ev.username; lastTime = ts;

    if (grouped) {
      const cont = document.createElement('div');
      cont.className = 'cont-msg' + (isMe ? ' me' : '');
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (isMe ? 'me' : 'them');
      bubble.textContent = ev.content;
      cont.appendChild(bubble);
      feed.appendChild(cont);
    } else {
      const [bg, fg] = avatarFor(ev.username);
      const group = document.createElement('div');
      group.className = 'msg-group' + (isMe ? ' me' : '');
      group.innerHTML = `
        <div class="avatar avatar-lg" style="background:${bg};color:${fg}">${initials(ev.username)}</div>
        <div class="msg-body">
          <div class="msg-meta">
            <span class="msg-sender">${ev.username}</span>
            <span class="msg-time">${timeStr(ev.timestamp)}</span>
          </div>
          <div class="bubble ${isMe ? 'me' : 'them'}">${escHtml(ev.content)}</div>
        </div>`;
      feed.appendChild(group);
    }
    feed.scrollTop = feed.scrollHeight;
  }

  function renderTyping() {
    const bar = document.getElementById('typing-bar');
    const others = [...typingUsers].filter(u => u !== currentUser);
    if (!others.length) { bar.innerHTML = ''; return; }
    const names = others.length === 1 ? others[0]
      : others.length === 2 ? others.join(' and ')
      : `${others[0]} and ${others.length - 1} others`;
    bar.innerHTML = `<div class="dots"><span></span><span></span><span></span></div>
                     <span>${names} ${others.length === 1 ? 'is' : 'are'} typing…</span>`;
  }

  function sendMessage() {
    const inp = document.getElementById('msg-input');
    const text = inp.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'message', content: text }));
    inp.value = '';
    stopTyping();
  }

  function stopTyping() {
    if (isTyping) {
      isTyping = false;
      if (ws && ws.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({ type: 'typing_stop' }));
    }
    clearTimeout(typingTimer);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('msg-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); return; }
    if (!isTyping && ws && ws.readyState === WebSocket.OPEN) {
      isTyping = true;
      ws.send(JSON.stringify({ type: 'typing' }));
    }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(stopTyping, 2500);
  });
</script>
</body>
</html>
