repos:
  # ── General hygiene ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
  # ── Python formatting ─────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
  # ── Import sorting ────────────────────────────────────────────
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
  # ── SAST: Python security linting ─────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
  # ── SAST: Semgrep (local pip install — Windows compatible) ────
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep
        language: python
        entry: semgrep
        args:
          - "--config=p/python"
          - "--config=p/secrets"
          - "--error"
          - "--quiet"
        types: [python]
        additional_dependencies: ["semgrep"]
