services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: paktechchat
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: local-dev-secret-change-me
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # The browser (not the container) calls the API, so this is the host-published port.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - app
    restart: unless-stopped

  # One-shot job: apply database migrations, then exit. The app waits for it, so
  # the two gunicorn workers never race to create the schema.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: paktechchat
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      SECRET_KEY: local-dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paktechchat
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d paktechchat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
